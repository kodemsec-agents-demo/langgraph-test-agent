apiVersion: apps/v1
kind: Deployment
metadata:
  name: langgraph-test-agent
  labels:
    app: langgraph-test-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langgraph-test-agent
  template:
    metadata:
      labels:
        app: langgraph-test-agent
    spec:
      serviceAccountName: langgraph-test-agent
      containers:
        - name: agent
          image: langgraph-test-agent:latest
          ports:
            - containerPort: 8080
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: MODEL_ID
              value: "us.anthropic.claude-sonnet-4-20250514"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: langgraph-test-agent
spec:
  selector:
    app: langgraph-test-agent
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: langgraph-test-agent
  annotations:
    # Set this to the IAM role ARN that has bedrock:InvokeModel permissions
    eks.amazonaws.com/role-arn: ""
